[project]
name = "trace-hcl-stable-baseline"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "absl-py==2.5.0",
  "fuzzywuzzy==0.18.0",
  "immutabledict==4.2.1",
  "langdetect==1.0.9",
  "nltk==3.10.3",
  "numpy>=2,<3",
  "openai>=1,<3",
  "python-Levenshtein==0.27.1",
  "rouge==1.0.1",
  "rouge-score==0.1.2",
  "sacrebleu==2.5.1",
  "tokenizers==0.22.2",
]

[project.optional-dependencies]
# In-process Qwen3.5-4B under MLX on this Mac (local_backend.py); transformers supplies the chat template.
local-model = ["mlx==0.32.2", "mlx-lm==0.31.3", "transformers==5.2.0"]

[dependency-groups]
dev = ["pytest>=8.4,<10"]

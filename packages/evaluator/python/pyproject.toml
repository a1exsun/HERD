[project]
name = "hero-evaluation"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
  "rouge==1.0.1",
  "rouge-score==0.1.2",
  "sacrebleu==2.5.1",
  "fuzzywuzzy==0.18.0",
  "python-Levenshtein==0.27.1",
  "tokenizers==0.22.2",
  "immutabledict==4.2.1",
  "langdetect==1.0.9",
]

[dependency-groups]
dev = ["pytest==9.1.1"]

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hero_evaluation"]

[tool.pytest.ini_options]
testpaths = ["tests"]

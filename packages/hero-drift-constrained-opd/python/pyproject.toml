[project]
name = "hero-drift-constrained-opd"
version = "0.1.0"
description = "HERO local Qwen runtime: loopback bridge and model registry; tests for the OPD stream runner"
requires-python = ">=3.10,<3.14"
dependencies = [
  "accelerate>=1.4.0",
  "huggingface-hub==1.30.0",
  "peft>=0.18.0,<1",
  "safetensors>=0.6.2,<1",
  "torch==2.14.0",
  "transformers==5.2.0",
]

[project.optional-dependencies]
bridge = ["fastapi>=0.116.0,<1", "uvicorn>=0.35.0,<1"]

[dependency-groups]
dev = ["pytest>=8.4.0,<10"]

[project.scripts]
hero-qwen-bridge = "hero_qwen.bridge:main"

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hero_qwen"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

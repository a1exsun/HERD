<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 944 454" width="944" height="454" role="img" aria-label="Results. Long-horizon stability on TRACE+17. HERD keeps its mean on the first eight tasks at 0.664 from stage 8 to stage 25 and loses 6.3 points of G-test, while Seq-LoRA falls to 0.372 at stage 12 and loses most of its general capability by stage 4.">
<title>Results · Long-horizon stability on TRACE+17</title>
